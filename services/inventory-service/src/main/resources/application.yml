server:
  port: ${PORT:8082}
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rh_inventory}
    username: ${DB_USER:rh_inventory}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/rh}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/rh/protocol/openid-connect/certs}
          audiences: rh-services
rh:
  administration-url: ${ADMINISTRATION_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
