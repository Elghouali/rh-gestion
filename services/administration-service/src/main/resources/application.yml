server:
  port: ${PORT:8081}
spring:
  application:
    name: administration-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rh_admin}
    username: ${DB_USER:rh_admin}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/rh}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/rh/protocol/openid-connect/certs}
          audiences: rh-services
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
