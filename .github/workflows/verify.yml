name: Verify RH
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/rh-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/rh-web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --coverage
      - run: npm run build
