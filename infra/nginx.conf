server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location ~ ^/(api|oauth2|login|logout)(/|$) {
  proxy_pass http://gateway:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_set_header X-User-Id "";
  proxy_set_header X-Branch-Id "";
 }
 location / { try_files $uri $uri/ /index.html; }
}
